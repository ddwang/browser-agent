name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline tests, build, and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run lint
      - run: bun run typecheck
      - name: Install fixture browser
        run: bun x --no-install patchright install --with-deps chrome
      - run: bun run test:offline

  package:
    name: Node ${{ matrix.node }} package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.20.0', '22.22.0', 23, 24, 25, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Install package fixture browser
        run: bun x --no-install patchright install --with-deps chrome
      - run: bun run test:package
        env:
          npm_config_engine_strict: 'true'
          MAGNITUDE_CORE_ONLY: ${{ matrix.node == '20.20.0' && '1' || '' }}
